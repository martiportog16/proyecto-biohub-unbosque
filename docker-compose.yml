# BioHub: infraestructura como código (S26).
# Un solo comando levanta todo:   docker compose up --build
# Solo Nginx publica un puerto hacia afuera (RNF-07): todo lo demás vive en la red interna.

x-app: &app
  build: .
  image: biohub:local
  restart: unless-stopped
  # T-11: Docker pregunta cada 10 s si la instancia puede atender (base de datos incluida).
  # Tres fallas seguidas = "unhealthy". Lo muestra `docker compose ps` y scripts/estado-salud.sh.
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 90s

x-postgres: &postgres
  image: postgres:16
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h localhost -d biohub"]
    interval: 5s
    retries: 20

services:

  # ---------- Datos ----------
  postgres-primaria:
    <<: *postgres
    environment:
      POSTGRES_DB: biohub
      POSTGRES_USER: ${DB_DUENO:-biohub}
      POSTGRES_PASSWORD: ${DB_CLAVE_DUENO:-biohub_dueno}
      CLAVE_REPLICADOR: ${DB_CLAVE_REPLICADOR:-replicador_cambiar}
    volumes:
      - datos-primaria:/var/lib/postgresql/data
      - ./infra/postgres/primaria-init.sh:/docker-entrypoint-initdb.d/01-replicacion.sh:ro

  postgres-replica-publica:
    <<: *postgres
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    environment:
      PRIMARIA_HOST: postgres-primaria
      SLOT: replica_publica
      CLAVE_REPLICADOR: ${DB_CLAVE_REPLICADOR:-replicador_cambiar}
      POSTGRES_PASSWORD: no-se-usa-en-replica
    volumes:
      - datos-replica-publica:/var/lib/postgresql/data
      - ./infra/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      postgres-primaria:
        condition: service_healthy

  postgres-replica-analitica:
    <<: *postgres
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    environment:
      PRIMARIA_HOST: postgres-primaria
      SLOT: replica_analitica
      CLAVE_REPLICADOR: ${DB_CLAVE_REPLICADOR:-replicador_cambiar}
      POSTGRES_PASSWORD: no-se-usa-en-replica
    volumes:
      - datos-replica-analitica:/var/lib/postgresql/data
      - ./infra/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      postgres-primaria:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # ---------- Aplicación: un artefacto, tres roles ----------
  app-cientifico:
    <<: *app
    deploy:
      replicas: 2          # T-10: redundancia activa del grupo científico
    environment:
      SPRING_PROFILES_ACTIVE: cientifico
      # DB_HOST_PRIMARIA solo cambia si se promueve una réplica (scripts/promover-replica.sh).
      DB_URL: jdbc:postgresql://${DB_HOST_PRIMARIA:-postgres-primaria}:5432/biohub
      DB_USUARIO: app_cientifico
      DB_CLAVE: ${DB_CLAVE_APP_CIENTIFICO:-cientifico_cambiar}
      FLYWAY_USUARIO: ${DB_DUENO:-biohub}
      FLYWAY_CLAVE: ${DB_CLAVE_DUENO:-biohub_dueno}
      DB_CLAVE_APP_CIENTIFICO: ${DB_CLAVE_APP_CIENTIFICO:-cientifico_cambiar}
      DB_CLAVE_APP_PUBLICO: ${DB_CLAVE_APP_PUBLICO:-publico_cambiar}
      DB_CLAVE_APP_BATCH: ${DB_CLAVE_APP_BATCH:-batch_cambiar}
      JWT_SECRETO: ${JWT_SECRETO:-cambiar-este-secreto-de-al-menos-32-caracteres}
      REDIS_HOST: redis
    depends_on:
      postgres-primaria:
        condition: service_healthy
      redis:
        condition: service_healthy

  app-publico:
    <<: *app
    deploy:
      replicas: 2          # T-05: escalado horizontal del grupo público
    environment:
      SPRING_PROFILES_ACTIVE: publico
      DB_URL: jdbc:postgresql://postgres-replica-publica:5432/biohub
      DB_USUARIO: app_publico
      DB_CLAVE: ${DB_CLAVE_APP_PUBLICO:-publico_cambiar}
      JWT_SECRETO: ${JWT_SECRETO:-cambiar-este-secreto-de-al-menos-32-caracteres}
      REDIS_HOST: redis
    depends_on:
      postgres-replica-publica:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-cientifico:              # espera a que Flyway termine las migraciones
        condition: service_healthy

  batch:
    <<: *app
    environment:
      SPRING_PROFILES_ACTIVE: batch
      # Lee (consulta pesada) de la réplica de analítica...
      DB_URL: jdbc:postgresql://postgres-replica-analitica:5432/biohub
      # ...y guarda el informe en la primaria (P-03).
      BATCH_PRIMARIA_URL: jdbc:postgresql://${DB_HOST_PRIMARIA:-postgres-primaria}:5432/biohub
      DB_USUARIO: app_batch
      DB_CLAVE: ${DB_CLAVE_APP_BATCH:-batch_cambiar}
      REDIS_HOST: redis
    # El batch no atiende web (no tiene /actuator): Docker solo vigila que el proceso siga vivo.
    healthcheck:
      disable: true
    depends_on:
      postgres-replica-analitica:
        condition: service_healthy
      postgres-primaria:
        condition: service_healthy
      app-cientifico:
        condition: service_healthy

  # ---------- Punto de entrada único (RNF-07, ADR-09) ----------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUERTO_BIOHUB:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 10s
      retries: 3
    # Nginx averigua las direcciones de las instancias al arrancar: que estén listas antes
    depends_on:
      app-publico:
        condition: service_healthy
      app-cientifico:
        condition: service_healthy

volumes:
  datos-primaria:
  datos-replica-publica:
  datos-replica-analitica:
