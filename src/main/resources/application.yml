# Configuración común a los tres roles (publico, cientifico, batch).
# Cada valor sensible viene de una variable de entorno; el valor después de ":" es
# solo para desarrollo local.

spring:
  application:
    name: biohub
  lifecycle:
    # Máximo que espera a las peticiones en curso (menos que los 10 s que da "docker stop").
    timeout-per-shutdown-phase: 8s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biohub}
    username: ${DB_USUARIO:biohub}
    password: ${DB_CLAVE:biohub}
    hikari:
      maximum-pool-size: ${DB_POOL:10}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PUERTO:6379}
  # Las migraciones solo las corre el rol científico (dueño de la primaria).
  flyway:
    enabled: false
    placeholders:
      clave_app_cientifico: ${DB_CLAVE_APP_CIENTIFICO:cientifico}
      clave_app_publico: ${DB_CLAVE_APP_PUBLICO:publico}
      clave_app_batch: ${DB_CLAVE_APP_BATCH:batch}

biohub:
  jwt:
    # Debe ser igual en todas las instancias y tener al menos 32 caracteres.
    secreto: ${JWT_SECRETO:solo-para-desarrollo-cambiar-en-produccion-2026}
    duracion-minutos: 60
  # Vida de cada respuesta en la caché del portal público (P-14: dato nuevo visible en ≤ 5 s)
  cache:
    vida-segundos: ${CACHE_VIDA_SEGUNDOS:3}

server:
  port: 8080
  # Apagado ordenado (RNF-04): al detener una instancia, termina las peticiones que
  # ya recibió y deja de aceptar nuevas. Nginx envía las nuevas a la otra instancia.
  shutdown: graceful
  # Nginx pasa la IP real del cliente; la app confía en esos encabezados.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness y /actuator/health/readiness (T-11)
      group:
        # "¿Puede atender?": la app arrancó y su base de datos responde. Lo usa el healthcheck
        # de Docker. Redis no está: si Redis cae, el portal sigue (lee de la réplica, paquete 08).
        readiness:
          include: readinessState,db
          show-components: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
