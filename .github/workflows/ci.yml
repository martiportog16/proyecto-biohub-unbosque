# Integración y entrega continua (S26).
# En cada pull request y en cada push a main:
#   compila -> pruebas unitarias -> pruebas de integración (PostgreSQL real) -> cobertura -> imagen Docker
# La imagen queda lista; desplegarla es una decisión humana (entrega continua, no despliegue continuo).

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: biohub
          POSTGRES_USER: biohub
          POSTGRES_PASSWORD: biohub
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U biohub"
          --health-interval 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]

    env:
      BIOHUB_TEST_DB_URL: jdbc:postgresql://localhost:5432/biohub
      BIOHUB_TEST_DB_USUARIO: biohub
      BIOHUB_TEST_DB_CLAVE: biohub

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y correr todas las pruebas
        run: mvn -B verify

      - name: Guardar reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/

      - name: Armar la imagen Docker
        run: docker build -t biohub:${{ github.sha }} .
