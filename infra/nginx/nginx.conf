# Nginx: ÚNICO punto de entrada de BioHub (RNF-07, ADR-09, T-18).
#
# Este archivo también es el REGISTRO DE SERVICIOS estático (P-04, T-20):
# si los servidores internos cambian de lugar, solo se editan los bloques
# "upstream" y el contrato externo /api/v1 sigue igual (RNF-08).

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 30s;

    # Límite GLOBAL solo para las rutas públicas (P-19): un pico público se frena
    # aquí antes de saturar Nginx, y el tráfico científico pasa sin límite.
    # 400 peticiones/s deja margen sobre la prueba de 60x = 300 peticiones/s (P-12).
    limit_req_zone $server_name zone=trafico_publico:1m rate=400r/s;
    limit_req_status 429;

    # El puerto por el que entró el navegador (8080 por defecto, o PUERTO_BIOHUB).
    # Nginx escucha en el 80 DENTRO del contenedor, así que se saca del encabezado
    # Host que mandó el navegador ("localhost:8080" -> 8080).
    map $http_host $puerto_externo {
        "~:(?<p>[0-9]+)$" $p;
        default           80;
    }

    # ---------- Registro de servicios ----------
    # Cada nombre tiene 2 instancias (Docker las reparte). Si una falla, Nginx la
    # saca de la rotación un tiempo y luego vuelve a probarla (T-10, T-11).
    # OJO: Nginx averigua las direcciones al arrancar. Si se recrea una instancia:
    #   docker compose exec nginx nginx -s reload
    #
    # Grupo PÚBLICO: tolera fallas aisladas (3 en 5 s). Con 300 peticiones/s, una
    # respuesta lenta suelta no debe sacar una instancia: medido en PR-02, con
    # "max_fails=1" un pico sacaba las DOS instancias y Nginx respondía 502.
    upstream grupo_publico {
        server app-publico:8080 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    # Grupo CIENTÍFICO: conmutación rápida (1 falla = fuera 15 s). Su tráfico es
    # bajo, y lo importante es que el registro pase a la otra instancia de
    # inmediato si una se cae (PR-04, 0 errores).

    upstream grupo_cientifico {
        server app-cientifico:8080 max_fails=1 fail_timeout=15s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name biohub;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host conserva el puerto ("localhost:8080"). Con $host se perdía, y
        # Swagger mandaba las peticiones a http://localhost (puerto 80): "Failed to fetch".
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $puerto_externo;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;

        # Si una instancia se cae, Nginx reintenta en otra (T-10, T-11).
        proxy_next_upstream error timeout http_502 http_503;

        # Portal público: páginas estáticas
        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }

        # Interfaz científica: páginas estáticas que llaman a /api/cientifico/** (paquete 17).
        # La política de seguridad (CSP) solo deja cargar código y estilos de este mismo
        # servidor y hablar solo con esta misma API: un script inyectado no podría
        # enviar el token a otro sitio.
        location /consola/ {
            root  /usr/share/nginx/html;
            index index.html;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            # Siempre la versión nueva después de un cambio (son pocos archivos pequeños)
            add_header Cache-Control "no-cache" always;
        }
        location = /consola {
            absolute_redirect off;      # "Location: /consola/", sin perder el puerto (8080)
            return 301 /consola/;
        }

        # API del portal público -> grupo público (lee caché y réplica)
        location /api/publico/ {
            limit_req zone=trafico_publico burst=200 nodelay;
            proxy_pass http://grupo_publico;
        }

        # API externa para universidades y ONG, contrato estable /v1 (RNF-08)
        location /api/v1/ {
            limit_req zone=trafico_publico burst=200 nodelay;
            proxy_pass http://grupo_publico;
        }

        # API científica -> grupo científico (único que escribe en la primaria)
        location /api/cientifico/ {
            # Registrar un hallazgo es un POST, y por defecto Nginx NO reintenta un POST
            # que ya envió (podría guardarse dos veces). Aquí sí se permite, pero solo
            # si la instancia falla en los primeros 3 s: eso pasa cuando está apagada o
            # apagándose y cortó la conexión sin procesar nada. Una respuesta lenta
            # (más de 3 s) nunca se reintenta. Ver docs/guia-disponibilidad.md.
            # En la red interna conectar tarda milisegundos: si en 1 s no conecta, la instancia está caída.
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_timeout 3s;
            proxy_next_upstream_tries 2;
            proxy_pass http://grupo_cientifico;
        }

        # Documentación de la API (OpenAPI / Swagger UI)
        location ~ ^/(swagger-ui|swagger-ui\.html|v3/api-docs) {
            proxy_pass http://grupo_cientifico;
        }

        # Las rutas internas de salud y métricas NO se exponen hacia afuera (RNF-07)
        location /actuator {
            return 404;
        }
    }
}
